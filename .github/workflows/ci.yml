name: Build and Push ML API to Docker Hub

# 코드가 GitHub 저장소의 main 브랜치에 Push될 때만 트리거됩니다.
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소에서 코드 내려받기
      - name: Checkout the codebase
        uses: actions/checkout@v4

      # 2. 멀티 아키텍처 지원 (필요시)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인 과정 (보안을 위해 GitHub Secrets 사용)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 이미지 태그와 라벨을 동적으로 생성
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 원하시는 Docker Hub 레포지토리 이름으로 변경 가능합니다.
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-sentiment-api

      # 5. 최적화된 도커 이미지를 빌드하고 Docker Hub로 Push (캐싱 사용)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 하단 코드는 도커 빌드 속도 향상을 위해 GitHub 캐시 레이어를 사용하는 설정입니다.
          cache-from: type=gha
          cache-to: type=gha,mode=max
