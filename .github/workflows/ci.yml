name: CI/CD Pipeline for ML API

on:
  push:
    branches:
      - main

jobs:
  # 1단계: 깃허브 클라우드 컴퓨터(ubuntu)에서 부담 없이 도커 이미지를 빌드하고 Docker Hub로 Push합니다.
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-sentiment-api
          tags: type=raw,value=latest
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2단계: 빌드가 완료되면 님의 컴퓨터(self-hosted)가 이미지를 내려받아 실행합니다!
  deploy-to-local:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      # Docker Hub 로그인 (가져올 때도 Rate Limit 문제 방지)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 최신 이미지 다운로드
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mlops-sentiment-api:latest

      # 기존에 돌고 있던 컨테이너 중지 (에러 무시)
      - name: Stop existing container
        run: docker stop mlops-api-container
        continue-on-error: true

      # 기존 컨테이너 삭제 (에러 무시)
      - name: Remove existing container
        run: docker rm mlops-api-container
        continue-on-error: true

      # 새로 다운받은 따끈따끈한 이미지로 컨테이너 실행
      - name: Run new container
        run: docker run -d --name mlops-api-container -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/mlops-sentiment-api:latest
