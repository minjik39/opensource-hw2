<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 감정 분석 (Zero-Shot)</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #6366f1;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --dark: #1e1e2f;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #1e1e2f, #2d2b42, #1f1c2c);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .background-blob {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            z-index: 0;
            animation: float 10s infinite alternate ease-in-out;
        }
        
        .blob-1 { top: -10%; left: -10%; background: linear-gradient(135deg, #f43f5e, #8b5cf6); }
        .blob-2 { bottom: -10%; right: -10%; background: linear-gradient(135deg, #3b82f6, #10b981); animation-duration: 15s; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(50px) scale(1.1); }
        }

        .glass-container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            background: rgba(0, 0, 0, 0.3);
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #4b5563;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: #9ca3af;
        }

        #result-container {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-emotion {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
        }

        .emotion-bars {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .emotion-label {
            width: 60px;
            font-size: 14px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .bar-container {
            flex-grow: 1;
            height: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 6px;
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .intensity-value {
            width: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
            color: #cbd5e1;
        }

        /* Color scales based on emotion */
        .fill-행복 { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .fill-슬픔 { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .fill-분노 { background: linear-gradient(90deg, #ef4444, #f87171); }
        .fill-공포 { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
        .fill-놀람 { background: linear-gradient(90deg, #10b981, #34d399); }
        .fill-혐오 { background: linear-gradient(90deg, #64748b, #94a3b8); }
        
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <div class="glass-container">
        <h1>감정 분석 AI (Zero-Shot)</h1>
        
        <div class="input-group">
            <textarea id="text-input" placeholder="당한 거 써보려고 갈아탄 게 개웃기네 ㅋㅋ&#10;처럼 은어나 장문을 입력해보세요! 분석에는 1~2초 정도 소요됩니다."></textarea>
            <button id="analyze-btn">
                <span id="btn-text">분석하기</span>
                <div class="loader" id="loader"></div>
            </button>
        </div>

        <div id="result-container">
            <div class="top-emotion">
                주요 감정: <span id="top-emotion-text" style="color: #fbbf24;"></span> <span id="top-emotion-emoji"></span>
            </div>
            
            <div class="emotion-bars" id="bars-container">
                <!-- Bars will be generated here -->
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('analyze-btn');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const barsContainer = document.getElementById('bars-container');
        const topEmotionText = document.getElementById('top-emotion-text');
        const topEmotionEmoji = document.getElementById('top-emotion-emoji');

        const emojis = {
            '행복': '😂',
            '슬픔': '😢',
            '분노': '😡',
            '공포': '😨',
            '놀람': '😲',
            '혐오': '🤢',
            '중립': '😐'
        };

        btn.addEventListener('click', async () => {
            const text = document.getElementById('text-input').value;
            if(!text.trim()) {
                alert("문장을 입력해주세요!");
                return;
            }

            // UI State Change
            btn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';
            resultContainer.style.display = 'none';
            barsContainer.innerHTML = '';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if(!response.ok) throw new Error("서버 에러가 발생했습니다.");

                const data = await response.json();
                
                // Set Top Emotion
                topEmotionText.innerText = data.top_emotion;
                topEmotionEmoji.innerText = emojis[data.top_emotion] || '🤔';
                
                // Set score color
                let mainColor = '#cbd5e1';
                if(data.top_emotion === '행복') mainColor = '#fbbf24';
                if(data.top_emotion === '분노') mainColor = '#f87171';
                topEmotionText.style.color = mainColor;

                // Create Bars
                Object.entries(data.intensities).forEach(([emotion, intensity]) => {
                    const widthPercent = (intensity / 5) * 100;
                    
                    const row = document.createElement('div');
                    row.className = 'bar-row';
                    row.innerHTML = `
                        <div class="emotion-label">${emotion}</div>
                        <div class="bar-container">
                            <div class="bar-fill fill-${emotion}" style="width: 0%"></div>
                        </div>
                        <div class="intensity-value">${intensity}</div>
                    `;
                    barsContainer.appendChild(row);

                    // Animate width after a tiny DOM delay
                    setTimeout(() => {
                        row.querySelector('.bar-fill').style.width = widthPercent + '%';
                    }, 50);
                });

                resultContainer.style.display = 'block';

            } catch(e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btnText.style.display = 'block';
                loader.style.display = 'none';
            }
        });

        // Trigger on Cmd/Ctrl + Enter
        document.getElementById('text-input').addEventListener('keydown', function(e) {
            if((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                btn.click();
            }
        });
    </script>
</body>
</html>
